[project]
name = "linto-diarization"
# Image versions live in <engine>/RELEASE.md, not here.
version = "0.0.0"
description = "Speaker diarization and speaker identification service for LinTO"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Shared code: celery_app, http_server, identification
dependencies = [
    "celery[redis]>=5.6.3",
    "redis>=5.2",
    "flask>=3.1",
    "flask-swagger-ui>=5.21",
    "gunicorn>=23.0",
    "gevent>=25.4",
    "pyyaml>=6.0",
    "memory-tempfile>=2.2.3",
    "tqdm>=4.66",
    "requests>=2.32",
    "numpy>=2.0",
    "soundfile>=0.13",
    # Must match the Qdrant server version deployed by linto-deploy
    "qdrant-client==1.18.0",
    # ECAPA speaker embeddings (identification/embedding.py)
    "speechbrain==1.1.1",
    "huggingface-hub>=0.34",
]

[project.optional-dependencies]
nemotron = [
    "nemo-toolkit[asr]",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    # CPU build from PyPI: torchaudio.load decodes through torchcodec (needs FFmpeg libs at runtime)
    "torchcodec==0.11.*",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false
# Docker images only: resolving for other platforms pulls in NeMo's own per-platform torch indexes
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# NeMo pins hydra-core<=1.3.2 (CVE-2026-68508, fixed in 1.3.4); output checked identical.
# lightning stays at 2.4.0: 2.6 breaks NeMo's OneLogger trainer at import.
override-dependencies = ["hydra-core>=1.3.4"]

[tool.uv.sources]
# NeMo 3.0.0 (PyPI) cannot load Nemotron-3-Diarization (RoPE attention). Pin a commit
# of main until a release ships it.
nemo-toolkit = { git = "https://github.com/NVIDIA-NeMo/Speech", rev = "cf724ac337d1ebc7d0dda1e23fb80916f52927a5" }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
# CUDA 12.8 wheels: driver >= 570, Ampere/Ada/Hopper/Blackwell
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["test"]
markers = ["gpu: needs a CUDA GPU and the Nemotron model"]
